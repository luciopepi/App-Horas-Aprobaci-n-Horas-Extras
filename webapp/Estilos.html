<style>
  /* ==================== RESET BASICO ==================== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    overflow-x: hidden;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p, dl, dd, dt, fieldset, legend { margin: 0; padding: 0; border: 0; }
  svg { display: block; }
  a { color: inherit; }

  /* ==================== TOKENS: PALETA MAESTRA (fijos, no se retematizan) ==================== */
  :root {
    color-scheme: dark;
    --vspt-plum: #4E1742;
    --vspt-deep-purple: #321032;
    --vspt-wine: #701F52;
    --vspt-crimson: #D81840;
    --vspt-amber: #F8C040;
    --vspt-orange: #F08808;
    --vspt-olive: #98A040;
    --vspt-cream: #F5EBD3;
    --vspt-beige: #E0D0B8;
    --vspt-beige-soft: #FAF5E8;
    --vspt-magenta: #B61858;

    /* Gradientes: son los UNICOS 4 permitidos por el manual. No inventar otros. */
    --grad-header: linear-gradient(135deg, #4E1742 0%, #321032 55%, #701F52 100%);
    --grad-gold: linear-gradient(180deg, #F8C040, #F08808);
    --grad-cta: linear-gradient(135deg, #321032, #D81840);
    --grad-kpi-critico: linear-gradient(90deg, #D81840, #701F52, #4E1742);

    --radius-card: 12px;
    --radius-btn: 8px;
    --radius-input: 7px;
    --radius-modal: 16px;

    /* WebApp real: Google Fonts por link (sin CSP de Artifacts que bloquee
       la CDN). El prototipo embebe la fuente porque ahi si hace falta. */
    --font-sans: 'Montserrat', system-ui, -apple-system, sans-serif;

    /* -------- superficies: oscuro por defecto -------- */
    --bg: #1A1915;
    --card: #222220;
    --card2: #2A2A28;
    --border: rgba(200,168,130,0.14);
    --text: #F2EDE4;
    --muted: #B8A898;
    --th-bg: #2A2A28;
    --tr-hover: rgba(212,112,90,0.06);
    --card-glass: rgba(34,34,32,0.90);
    --shadow: 0 2px 10px rgba(0,0,0,0.30);

    /* variantes de texto de los semaforos, ajustadas para cumplir AA sobre
       las superficies de este tema (el color "puro" del manual no siempre
       alcanza 4.5:1 como texto; se preserva integro para fondos/iconos). */
    --crimson-text: #F27D92;
    --olive-text: #A8B052;
    --amber-text: #F8C040;
    --focus-ring: #F8C040;

    /* blobs: solo decorativos, solo en modo oscuro, solo wine/plum (nunca
       colores semanticos como amber/crimson) */
    --blob-a: var(--vspt-wine);
    --blob-b: var(--vspt-plum);
  }

  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #FAF5E8;
      --card: #FFFFFF;
      --card2: #F5EBD3;
      --border: rgba(78,23,66,0.14);
      --text: #4E1742;
      --muted: #7A627A;
      --th-bg: #F5EBD3;
      --tr-hover: rgba(78,23,66,0.05);
      --card-glass: rgba(255,255,255,0.90);
      --shadow: 0 2px 6px rgba(78,23,66,0.10);
      --crimson-text: #B61030;
      --olive-text: #586024;
      --amber-text: #8A5A00;
      --focus-ring: #B8790A;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1A1915; --card: #222220; --card2: #2A2A28;
    --border: rgba(200,168,130,0.14); --text: #F2EDE4; --muted: #B8A898;
    --th-bg: #2A2A28; --tr-hover: rgba(212,112,90,0.06);
    --card-glass: rgba(34,34,32,0.90);
    --shadow: 0 2px 10px rgba(0,0,0,0.30);
    --crimson-text: #F27D92; --olive-text: #A8B052; --amber-text: #F8C040;
    --focus-ring: #F8C040;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #FAF5E8; --card: #FFFFFF; --card2: #F5EBD3;
    --border: rgba(78,23,66,0.14); --text: #4E1742; --muted: #7A627A;
    --th-bg: #F5EBD3; --tr-hover: rgba(78,23,66,0.05);
    --card-glass: rgba(255,255,255,0.90);
    --shadow: 0 2px 6px rgba(78,23,66,0.10);
    --crimson-text: #B61030; --olive-text: #586024; --amber-text: #8A5A00;
    --focus-ring: #B8790A;
  }

  /* NOTA sobre el foco en modo claro: el manual pide outline AMBER puro
     (#F8C040), pero ese amber da 1.67:1 contra tarjetas blancas (falla el
     3:1 de componentes UI de WCAG). --focus-ring usa una version mas
     oscura de la misma familia (#B8790A, 3.6:1) SOLO en claro, para que el
     foco se pueda ver de verdad; en oscuro es el amber puro del manual. */

  html, body { background: var(--bg); }
  body {
    font-family: var(--font-sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background .3s, color .3s;
  }

  /* ==================== TIPOGRAFIA ==================== */
  .num, .kpi-value { font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; }
  .h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
  .h3 { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .body-text { font-size: 14px; font-weight: 400; line-height: 1.55; }
  .body-sm { font-size: 12.5px; font-weight: 400; line-height: 1.5; }
  .caption { font-size: 11px; font-weight: 400; color: var(--muted); line-height: 1.4; }
  @media (min-width: 640px) {
    .h1 { font-size: 34px; }
    .h2 { font-size: 24px; }
    .h3 { font-size: 18px; }
  }

  /* ==================== FONDO ==================== */
  .app-shell {
    position: relative;
    min-height: 100vh;
    isolation: isolate;
    background: var(--bg);
  }
  /* Institucional muy oscurecido, SOLO en oscuro, para que las tarjetas se despeguen. */
  .app-shell::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -2;
    background: var(--grad-header);
    opacity: .22;
    pointer-events: none;
  }
  @media (prefers-color-scheme: light) {
    .app-shell::before { opacity: 0; }
  }
  .blobs { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .20;
    will-change: transform;
  }
  .blob-1 { width: 340px; height: 340px; left: -90px; top: -70px; background: var(--blob-a); animation: driftA 46s ease-in-out infinite alternate; }
  .blob-2 { width: 300px; height: 300px; right: -80px; top: 32%; background: var(--blob-b); animation: driftB 54s ease-in-out infinite alternate; }

  @keyframes driftA { from { transform: translate(0,0) scale(1); } to { transform: translate(35px, 25px) scale(1.1); } }
  @keyframes driftB { from { transform: translate(0,0) scale(1); } to { transform: translate(-25px, 30px) scale(1.06); } }

  /* Modo claro: fondo limpio, sin gradiente institucional ni blobs. */
  @media (prefers-color-scheme: light) {
    .blobs { display: none; }
  }
  :root[data-theme="light"] .app-shell::before { opacity: 0 !important; }
  :root[data-theme="light"] .blobs { display: none; }
  :root[data-theme="dark"] .app-shell::before { opacity: .22; }
  :root[data-theme="dark"] .blobs { display: block; }

  /* ==================== LAYOUT ==================== */
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 14px 56px;
  }
  @media (min-width: 860px) {
    .container { max-width: 960px; padding: 24px 28px 80px; }
  }

  /* ==================== SUPERFICIE DE TARJETA ==================== */
  .surface {
    background: var(--card-glass);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .card {
    border-radius: var(--radius-card);
    padding: 14px;
  }
  @media (min-width: 640px) {
    .card { padding: 18px; }
  }
  .card-alert    { border-top: 3px solid var(--vspt-crimson); }
  .card-atencion { border-top: 3px solid var(--vspt-amber); }
  .card-ok       { border-top: 3px solid var(--vspt-olive); }
  .card-neutral  { border-top: 3px solid var(--vspt-orange); }

  /* ==================== HEADER INSTITUCIONAL ==================== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius-card);
    margin-bottom: 14px;
    flex-wrap: wrap;
    background: var(--grad-header);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .condor-logo { flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-text strong { font-size: 14px; font-weight: 700; letter-spacing: 0; white-space: nowrap; color: #fff; }
  .brand-text span { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  .role-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .theme-toggle {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    transition: transform .15s ease, background .15s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { transform: translateY(-1px); }
  .theme-toggle svg { width: 17px; height: 17px; }

  /* Foco visible: regla dura del manual. Amber en oscuro; version oscurecida
     de amber en claro para que sea realmente visible (ver nota arriba). */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ==================== VISTAS ==================== */
  .view { display: none; }
  .view.active { display: block; animation: viewIn .28s ease both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .section-title .h3 { margin: 0; }
  .muted-text { color: var(--muted); font-weight: 400; }

  .icon { flex-shrink: 0; }
  .icon-14 { width: 14px; height: 14px; }
  .icon-16 { width: 16px; height: 16px; }
  .icon-18 { width: 18px; height: 18px; }
  .icon-20 { width: 20px; height: 20px; }
  .icon-24 { width: 24px; height: 24px; }
  .icon-32 { width: 32px; height: 32px; }

  /* ==================== KPI CARD (saldo) ==================== */
  .kpi-card {
    text-align: left;
    margin-bottom: 12px;
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .kpi-value {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin: 6px 0 4px;
    color: var(--text);
  }
  .kpi-value.is-ok { color: var(--olive-text); }
  .kpi-value.is-alerta { color: var(--crimson-text); }
  .kpi-sub { font-size: 11px; font-weight: 500; color: var(--muted); }
  .kpi-breakdown {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 12px;
    margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .kpi-breakdown b { color: var(--text); font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .dot-gen { background: var(--vspt-amber); }
  .dot-comp { background: var(--vspt-wine); }

  /* Grilla de KPIs chicos (vista Personas) */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  @media (min-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .kpi-mini { text-align: left; }
  .kpi-mini .kpi-value { font-size: 26px; margin: 4px 0 2px; }

  /* ==================== BOTONES ==================== */
  .btn {
    border-radius: var(--radius-btn);
    padding: 9px 16px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.17em;
    border: 1px solid transparent;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform .12s ease, filter .15s ease, box-shadow .15s ease;
    font-family: var(--font-sans);
  }
  .btn .icon { width: 16px; height: 16px; }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); filter: brightness(.97); }

  .btn-primary {
    background: var(--grad-cta);
    color: #fff;
  }
  .btn-secondary {
    background: var(--vspt-amber);
    color: var(--vspt-plum);
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-approve {
    /* Aprobar NO puede ser el CTA crimson (crimson = alerta). Olive solido
       con texto plum: 4.88:1, pasa AA en ambos temas (color fijo, no
       depende del tema). */
    background: var(--vspt-olive);
    color: var(--vspt-plum);
  }
  .btn-reject {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--crimson-text);
  }
  .btn-sm { min-height: 38px; padding: 7px 12px; font-size: 10px; }
  .btn:disabled, .btn[aria-disabled="true"] {
    opacity: .45;
    cursor: not-allowed;
    filter: none;
    transform: none;
  }

  .actions-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  @media (max-width: 420px) {
    .actions-row { grid-template-columns: 1fr; }
  }

  /* ==================== CHIPS DE ESTADO (color + icono + texto, nunca solo color) ==================== */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .chip-pendiente { background: rgba(248,192,64,0.18); color: var(--amber-text); }
  .chip-aprobada  { background: rgba(152,160,64,0.20); color: var(--olive-text); }
  .chip-rechazada { background: rgba(216,24,64,0.20); color: var(--crimson-text); }
  @media (prefers-color-scheme: light) {
    .chip-pendiente { background: rgba(248,192,64,0.30); }
    .chip-aprobada  { background: rgba(152,160,64,0.28); }
    .chip-rechazada { background: rgba(216,24,64,0.16); }
  }
  :root[data-theme="light"] .chip-pendiente { background: rgba(248,192,64,0.30); }
  :root[data-theme="light"] .chip-aprobada  { background: rgba(152,160,64,0.28); }
  :root[data-theme="light"] .chip-rechazada { background: rgba(216,24,64,0.16); }

  /* ==================== LISTAS ==================== */
  .list-card { margin-bottom: 14px; }
  .solicitudes-list li,
  .pendientes-list > li {
    opacity: 0;
    animation: itemIn .42s cubic-bezier(.16,1,.3,1) both;
    animation-delay: calc(var(--i, 0) * 60ms);
  }
  @keyframes itemIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .solicitud-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--border);
  }
  .solicitud-item:last-child { border-bottom: 0; }
  .sol-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sol-tipo {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    background: var(--card2);
    border: 1px solid var(--border);
    flex-shrink: 0;
    color: var(--muted);
  }
  .sol-info { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .sol-info strong { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sol-meta { font-size: 11px; color: var(--muted); }
  .sol-chevron { color: var(--muted); flex-shrink: 0; }

  /* ==================== ESTADO VACIO ==================== */
  .estado-vacio {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    padding: 28px 12px;
    color: var(--muted);
  }
  .estado-vacio .icon { color: var(--muted); opacity: .7; }
  .estado-vacio strong { font-size: 13px; font-weight: 700; color: var(--text); }
  .estado-vacio span { font-size: 12px; }

  /* ==================== VISTA JEFE ==================== */
  .jefe-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .badge-count {
    background: var(--vspt-amber);
    color: var(--vspt-plum);
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 2px;
  }

  .pendientes-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .pendiente-card {
    border-radius: var(--radius-card);
    padding: 14px;
    position: relative;
    overflow: hidden;
    transition: opacity .32s ease, transform .32s ease, max-height .32s ease, margin .32s ease, padding .32s ease;
  }
  .pendiente-card.leaving {
    opacity: 0;
    transform: translateX(40px) scale(.97);
    max-height: 0;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
    pointer-events: none;
  }
  .pend-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .pend-who { display: flex; align-items: center; gap: 8px; }
  .pend-who strong { font-size: 14px; font-weight: 700; }
  .pend-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--muted);
    flex-shrink: 0;
  }
  .pend-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .pend-grid dt { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 2px; }
  .pend-grid dd { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pend-motivo { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .pend-actions { display: flex; gap: 8px; }
  .pend-actions .btn { flex: 1; min-height: 42px; padding: 8px 12px; }

  .approved-flash {
    position: absolute;
    inset: 0;
    background: var(--vspt-olive);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--vspt-plum);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0;
    border-radius: var(--radius-card);
  }
  .approved-flash.show { animation: flashIn .5s ease both; }
  @keyframes flashIn { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

  /* Panel de "aprobar en descubierto" cuando el saldo de una compensacion no alcanza. */
  .confirmar-descubierto {
    margin-top: 10px;
    padding: 10px 11px;
    border-radius: var(--radius-input);
    background: rgba(216,24,64,0.14);
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .confirmar-descubierto.show { display: flex; }
  .confirmar-descubierto p {
    font-size: 12px;
    font-weight: 500;
    color: var(--crimson-text);
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }

  .equipo-card { margin-bottom: 12px; }
  .equipo-list { display: flex; flex-direction: column; gap: 12px; }
  .equipo-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
