<script>
(function () {
  "use strict";

  /* ==================== ICONOS (trazo Lucide, dibujados a mano) ==================== */
  var ICONS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
    chevronRight: '<path d="m9 6 6 6-6 6"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    alertTriangle: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'
  };
  function svgIcon(nombre, clase) {
    return '<svg class="icon ' + (clase || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[nombre] + '</svg>';
  }

  var fmt = function (n) {
    return (Math.round((n || 0) * 10) / 10).toFixed(1).replace('.', ',');
  };

  // Para indicadores chicos: entero sin ",0" (2 -> "2", 2.5 -> "2,5").
  function fmtCorto(n) {
    var num = Math.round((n || 0) * 10) / 10;
    return (num % 1 === 0) ? String(num) : String(num).replace('.', ',');
  }

  // Escapa texto antes de insertarlo con innerHTML. El "Motivo" lo escribe
  // el supervisor y se termina mostrando en la pantalla del Jefe, asi que
  // nunca hay que volcarlo crudo en el HTML.
  var _escDiv = document.createElement('div');
  function esc(valor) {
    _escDiv.textContent = valor == null ? '' : String(valor);
    return _escDiv.innerHTML;
  }

  /* ==================== LLAMADAS AL SERVIDOR ==================== */
  // Todas pasan por withFailureHandler: ningun boton se queda "colgado"
  // sin feedback si el servidor tira un error (rol invalido, saldo
  // insuficiente, solicitud ya procesada, etc.).
  function llamarServidor(nombreFuncion) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) {
          reject(error && error.message ? error : new Error(String(error)));
        });
      runner[nombreFuncion].apply(runner, args);
    });
  }

  /* ==================== TEMA ==================== */
  var root = document.documentElement;
  var themeToggle = document.getElementById('themeToggle');
  var iconMoon = document.getElementById('iconMoon');
  var iconSun = document.getElementById('iconSun');

  function temaActual() {
    var explicito = root.getAttribute('data-theme');
    if (explicito) return explicito;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function aplicarIconoTema() {
    var esOscuro = temaActual() === 'dark';
    iconMoon.hidden = !esOscuro;
    iconSun.hidden = esOscuro;
    themeToggle.setAttribute('aria-label', esOscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  }

  themeToggle.addEventListener('click', function () {
    var nuevo = temaActual() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', nuevo);
    try { localStorage.setItem('horasextra_tema', nuevo); } catch (err) { /* modo privado, no critico */ }
    aplicarIconoTema();
  });

  (function initTema() {
    var guardado = null;
    try { guardado = localStorage.getItem('horasextra_tema'); } catch (err) { /* no critico */ }
    if (guardado === 'dark' || guardado === 'light') root.setAttribute('data-theme', guardado);
    aplicarIconoTema();
  })();

  /* ==================== CONTADOR ANIMADO ==================== */
  function animarNumero(el, destino, duracionMs, sufijo) {
    var inicio = 0;
    var t0 = null;
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function paso(ts) {
      if (t0 === null) t0 = ts;
      var progreso = Math.min(1, (ts - t0) / duracionMs);
      var valor = inicio + (destino - inicio) * easeOutCubic(progreso);
      el.textContent = fmt(valor) + (sufijo || '');
      if (progreso < 1) requestAnimationFrame(paso);
      else el.textContent = fmt(destino) + (sufijo || '');
    }
    requestAnimationFrame(paso);
  }

  /* ==================== PANTALLAS: cargando / error / app ==================== */
  var viewCargando = document.getElementById('viewCargando');
  var viewError = document.getElementById('viewError');
  var errorTitulo = document.getElementById('errorTitulo');
  var errorMensaje = document.getElementById('errorMensaje');
  var rolePill = document.getElementById('rolePill');
  var TODAS_LAS_VISTAS = ['viewSupervisor', 'viewJefe', 'viewPersonas'];

  function ocultarTodo() {
    viewCargando.hidden = true;
    viewError.hidden = true;
    TODAS_LAS_VISTAS.forEach(function (id) {
      var el = document.getElementById(id);
      el.hidden = true;
      el.classList.remove('active');
    });
  }

  function mostrarCargando() {
    ocultarTodo();
    viewCargando.hidden = false;
  }

  function mostrarError(err) {
    ocultarTodo();
    errorMensaje.textContent = (err && err.message) ? err.message :
      'No pudimos conectar con el servidor. Revisa tu conexion e intenta de nuevo.';
    viewError.hidden = false;
  }

  var ROL_ETIQUETA = { Supervisor: 'Supervisor', Jefe: 'Jefe', Personas: 'Gerencia de Personas' };

  function mostrarVista(rol) {
    ocultarTodo();
    rolePill.hidden = false;
    rolePill.textContent = ROL_ETIQUETA[rol] || rol;
    var idVista = rol === 'Supervisor' ? 'viewSupervisor' : rol === 'Jefe' ? 'viewJefe' : 'viewPersonas';
    var el = document.getElementById(idVista);
    el.hidden = false;
    el.classList.add('active');
  }

  document.getElementById('btnReintentar').addEventListener('click', cargarEstado);

  /* ==================== ESTADO GLOBAL EN MEMORIA (lo ultimo que mando el servidor) ==================== */
  var estadoActual = null;

  async function cargarEstado() {
    mostrarCargando();
    try {
      var data = await llamarServidor('apiEstado');
      estadoActual = data;
      mostrarVista(data.yo.rol);
      if (data.yo.rol === 'Supervisor') { renderSupervisor(data); calSupervisor.recargarActual(); }
      if (data.yo.rol === 'Jefe') { renderJefe(data); calJefe.recargarActual(); if (conJefe) conJefe.recargar(); }
      if (data.yo.rol === 'Personas') { renderPersonas(data); calPersonas.recargarActual(); if (conPersonas) conPersonas.recargar(); }

      // El Jefe tambien puede cargar horas extra propias. Si tiene
      // actividad, ademas de su bandeja de pendientes ve su panel
      // personal (saldo, historial y botones de carga), que si no
      // quedaria invisible: cargaria horas que nunca podria consultar.
      if (data.yo.rol !== 'Supervisor' && data.mostrarPanelPersonal) {
        var panel = document.getElementById('viewSupervisor');
        panel.hidden = false;
        panel.classList.add('active');
        renderSupervisor(data);
        calSupervisor.recargarActual();
      }
    } catch (err) {
      mostrarError(err);
    }
  }

  /* ==================== RENDER: SUPERVISOR ==================== */
  function chipInfo(estado) {
    var e = String(estado || '').toLowerCase();
    if (e === 'aprobada') return { clase: 'chip-aprobada', texto: 'Aprobada', icono: 'check' };
    if (e === 'rechazada') return { clase: 'chip-rechazada', texto: 'Rechazada', icono: 'x' };
    return { clase: 'chip-pendiente', texto: 'Pendiente', icono: 'clock' };
  }

  function estadoVacio(mensaje, submensaje) {
    return '<li class="estado-vacio">' + svgIcon('calendar', 'icon-32') +
      '<strong>' + esc(mensaje) + '</strong><span>' + esc(submensaje) + '</span></li>';
  }

  function unificarSolicitudes(data) {
    var lista = [];
    (data.misSolicitudes || []).forEach(function (s) {
      lista.push({
        id: s.id, tipo: 'HE',
        titulo: fmt(s.horas) + ' hs · ' + (s.motivo || 'Horas extra'),
        fecha: s.fecha, linea: s.linea, estado: s.estado
      });
    });
    (data.misCompensaciones || []).forEach(function (s) {
      lista.push({
        id: s.id, tipo: 'CP',
        titulo: 'Compensacion · ' + (s.tipo || ''),
        fecha: s.fecha, linea: '-', estado: s.estado
      });
    });
    lista.sort(function (a, b) { return a.id < b.id ? 1 : -1; }); // el ID trae fecha-hora: mas nuevo primero
    return lista;
  }

  function renderSupervisor(data) {
    document.getElementById('saldoGeneradas').textContent = fmt(data.saldo.generadas);
    document.getElementById('saldoCompensadas').textContent = fmt(data.saldo.compensadas);
    animarNumero(document.getElementById('saldoNumber'), data.saldo.disponible, 700, ' hs');

    var lista = unificarSolicitudes(data);
    var cont = document.getElementById('listaSolicitudes');
    cont.innerHTML = '';
    if (!lista.length) {
      cont.innerHTML = estadoVacio('No tenes solicitudes todavia', 'Cargá tu primera hora extra con el boton de arriba.');
      return;
    }
    lista.forEach(function (s, i) {
      var li = document.createElement('li');
      li.className = 'solicitud-item';
      li.style.setProperty('--i', i);
      var info = chipInfo(s.estado);
      li.innerHTML =
        '<div class="sol-main">' +
          '<span class="sol-tipo">' + esc(s.tipo) + '</span>' +
          '<div class="sol-info"><strong>' + esc(s.titulo) + '</strong><span class="sol-meta">' + esc(s.fecha) + (s.linea && s.linea !== '-' ? ' · ' + esc(s.linea) : '') + '</span></div>' +
        '</div>' +
        '<span class="chip ' + info.clase + '">' + svgIcon(info.icono, 'icon-14') + info.texto + '</span>' +
        '<span class="sol-chevron">' + svgIcon('chevronRight', 'icon-16') + '</span>';
      cont.appendChild(li);
    });
  }

  /* ==================== RENDER: JEFE ==================== */
  function renderJefe(data) {
    var cont = document.getElementById('listaPendientes');
    var pendCount = document.getElementById('pendCount');
    var pendientes = data.pendientes || [];
    pendCount.textContent = pendientes.length;
    cont.innerHTML = '';

    if (!pendientes.length) {
      cont.innerHTML = estadoVacio('No hay nada pendiente', 'Cuando alguien cargue horas o pida compensacion, aparece aca.');
    } else {
      pendientes.forEach(function (p, i) {
        var li = document.createElement('li');
        li.className = 'pendiente-card surface card-atencion';
        li.style.setProperty('--i', i);
        li.dataset.id = p.id;
        li.innerHTML =
          '<div class="approved-flash">' + svgIcon('check', 'icon-18') + '<span>Aprobada</span></div>' +
          '<div class="pend-top">' +
            '<div class="pend-who"><span class="pend-avatar">' + svgIcon('user', 'icon-16') + '</span><strong>' + esc(p.nombre) + '</strong></div>' +
            '<span class="chip chip-pendiente">' + svgIcon('clock', 'icon-14') + 'Pendiente</span>' +
          '</div>' +
          '<dl class="pend-grid">' +
            '<div><dt>Fecha</dt><dd>' + esc(p.fecha) + '</dd></div>' +
            '<div><dt>Horas</dt><dd class="num">' + fmt(p.horas) + ' hs</dd></div>' +
            '<div><dt>Linea</dt><dd>' + esc(p.linea) + '</dd></div>' +
          '</dl>' +
          '<p class="pend-motivo">' + esc(p.motivo) + '</p>' +
          '<div class="pend-actions">' +
            '<button type="button" class="btn btn-reject" data-action="rechazar">' + svgIcon('x', 'icon-16') + 'Rechazar</button>' +
            '<button type="button" class="btn btn-approve" data-action="aprobar">' + svgIcon('check', 'icon-16') + 'Aprobar</button>' +
          '</div>' +
          '<div class="confirmar-descubierto" data-confirmar>' +
            '<p>' + svgIcon('alertTriangle', 'icon-16') + '<span data-confirmar-msg></span></p>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-action="aprobar-igual">Aprobar en descubierto</button>' +
          '</div>';
        cont.appendChild(li);
      });
    }

    renderEquipoLista(data.equipo || []);
  }

  function renderEquipoLista(equipo) {
    var cont = document.getElementById('listaEquipo');
    cont.innerHTML = '';
    if (!equipo.length) {
      cont.innerHTML = estadoVacio('Todavia no hay supervisores', 'Cargalos en la hoja "Correos" con rol Supervisor.');
      return;
    }
    var maxSaldo = Math.max.apply(null, equipo.map(function (p) { return p.saldo; }).concat([1]));
    equipo.forEach(function (p, i) {
      var pct = maxSaldo > 0 ? Math.max(4, Math.round((p.saldo / maxSaldo) * 100)) : 4;
      var li = document.createElement('li');
      li.className = 'equipo-item';
      li.style.setProperty('--i', i);
      li.innerHTML =
        '<div class="equipo-info">' + svgIcon('user', 'icon-16') + '<strong>' + esc(p.nombre) + '</strong></div>' +
        '<div class="equipo-sub">HE del mes: <span class="num">' + fmt(p.heDelMes) + '</span> hs</div>' +
        '<div class="equipo-bar-track"><div class="equipo-bar" style="--pct:' + pct + '%"></div></div>' +
        '<span class="equipo-saldo num">' + fmt(p.saldo) + ' hs</span>';
      cont.appendChild(li);
    });
  }

  document.getElementById('listaPendientes').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    var card = btn.closest('.pendiente-card');
    var id = card.dataset.id;
    var accion = btn.getAttribute('data-action');

    if (accion === 'rechazar' || accion === 'aprobar') {
      resolverPendiente(card, id, accion, false);
    } else if (accion === 'aprobar-igual') {
      resolverPendiente(card, id, 'aprobar', true);
    }
  });

  async function resolverPendiente(card, id, accion, confirmar) {
    card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    try {
      var r = await llamarServidor('apiResolver', id, accion, confirmar);
      if (r && r.requiereConfirmacion) {
        // Saldo insuficiente en una compensacion: no es un error, es un
        // estado intermedio. Mostramos el panel de confirmacion explicita
        // y reactivamos los botones (menos el de aprobar directo, que ya
        // no aplica: la proxima accion es "aprobar en descubierto").
        var panel = card.querySelector('[data-confirmar]');
        card.querySelector('[data-confirmar-msg]').textContent = r.mensaje;
        panel.classList.add('show');
        card.querySelectorAll('.pend-actions button').forEach(function (b) { b.disabled = false; });
        return;
      }
      if (accion === 'aprobar') {
        var flash = card.querySelector('.approved-flash');
        flash.classList.add('show');
      }
      setTimeout(function () {
        card.classList.add('leaving');
        setTimeout(function () { cargarEstado(); }, 340);
      }, accion === 'aprobar' ? 420 : 60);
    } catch (err) {
      // No dejamos el boton colgado: mostramos el error y reactivamos.
      card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
      window.alert(err.message || 'No se pudo procesar la solicitud.');
    }
  }

  /* ==================== RENDER: PERSONAS (solo lectura) ==================== */
  function renderPersonas(data) {
    document.getElementById('personasTotalMes').textContent = fmt(data.totales.heDelMes) + ' hs';
    document.getElementById('personasPendientes').textContent = String(data.totales.pendientes);
    document.getElementById('personasSaldoTotal').textContent = fmt(data.totales.saldoTotal) + ' hs';

    var tbody = document.getElementById('personasTablaBody');
    tbody.innerHTML = '';
    var equipo = data.equipo || [];
    if (!equipo.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="padding:16px 10px;color:var(--muted)">Todavia no hay supervisores cargados.</td></tr>';
      return;
    }
    equipo.forEach(function (p) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><span class="persona-cell">' + svgIcon('user', 'icon-14') + esc(p.nombre) + '</span></td>' +
        '<td class="num-col num">' + fmt(p.heDelMes) + ' hs</td>' +
        '<td class="num-col num">' + fmt(p.compensadas) + ' hs</td>' +
        '<td class="num-col num"><strong>' + fmt(p.saldo) + ' hs</strong></td>';
      tbody.appendChild(tr);
    });
  }

  /* ==================== MODALES ==================== */
  var appContainer = document.getElementById('appContainer');
  var focoAntesDelModal = null;

  function elementosFocosables(root) {
    var selector = 'a[href], button:not([disabled]), input:not([disabled]), ' +
      'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    return Array.prototype.filter.call(root.querySelectorAll(selector), function (el) {
      return el.offsetParent !== null;
    });
  }

  function atraparTab(overlay) {
    return function (ev) {
      if (ev.key !== 'Tab') return;
      var focosables = elementosFocosables(overlay);
      if (!focosables.length) return;
      var primero = focosables[0];
      var ultimo = focosables[focosables.length - 1];
      if (ev.shiftKey && document.activeElement === primero) {
        ev.preventDefault();
        ultimo.focus();
      } else if (!ev.shiftKey && document.activeElement === ultimo) {
        ev.preventDefault();
        primero.focus();
      }
    };
  }

  function abrirModal(overlay) {
    focoAntesDelModal = document.activeElement;
    if ('inert' in appContainer) appContainer.inert = true;
    else appContainer.setAttribute('aria-hidden', 'true');
    overlay.setAttribute('aria-hidden', 'false');
    overlay.classList.add('open');
    var focoInicial = overlay.querySelector('input, select, textarea, button');
    if (focoInicial) setTimeout(function () { focoInicial.focus(); }, 40);
    overlay._trapHandler = atraparTab(overlay);
    overlay.addEventListener('keydown', overlay._trapHandler);
  }
  function cerrarModal(overlay) {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    if (overlay._trapHandler) {
      overlay.removeEventListener('keydown', overlay._trapHandler);
      overlay._trapHandler = null;
    }
    if ('inert' in appContainer) appContainer.inert = false;
    else appContainer.removeAttribute('aria-hidden');
    if (focoAntesDelModal && typeof focoAntesDelModal.focus === 'function') {
      focoAntesDelModal.focus();
    }
    focoAntesDelModal = null;
  }

  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (ev) {
      if (ev.target === overlay) cerrarModal(overlay);
    });
    overlay.querySelectorAll('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () { cerrarModal(overlay); });
    });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    document.querySelectorAll('.modal-overlay.open').forEach(function (o) { cerrarModal(o); });
  });

  var overlayHE = document.getElementById('overlayHE');
  var overlayComp = document.getElementById('overlayComp');
  var overlaySuccess = document.getElementById('overlaySuccess');
  var successText = document.getElementById('successText');

  document.getElementById('btnAbrirHE').addEventListener('click', function () {
    document.getElementById('formHE').reset();
    document.getElementById('errorHE').hidden = true;
    abrirModal(overlayHE);
  });
  document.getElementById('btnAbrirComp').addEventListener('click', function () {
    document.getElementById('formComp').reset();
    document.getElementById('compError').hidden = true;
    calcularComp();
    abrirModal(overlayComp);
  });

  function mostrarExito(texto) {
    successText.textContent = texto;
    // reinicia las animaciones SVG por si se muestra dos veces seguidas
    overlaySuccess.querySelectorAll('svg *').forEach(function (n) {
      n.style.animation = 'none';
      void n.offsetWidth;
      n.style.animation = '';
    });
    abrirModal(overlaySuccess);
    setTimeout(function () { cerrarModal(overlaySuccess); }, 1500);
  }

  /* ==================== CALENDARIO ==================== */
  var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio',
    'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var MESES_ABREV = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var DIAS_SEMANA_CORTO = ['LUN', 'MAR', 'MIE', 'JUE', 'VIE', 'SAB', 'DOM'];
  var DIAS_SEMANA_LARGO = ['Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado', 'Domingo'];

  // Semana ISO 8601 a partir de partes de fecha (todo en UTC para que la
  // aritmetica de dias sea exacta, sin corrimientos de zona horaria).
  function isoSemana(anio, mes, dia) {
    var d = new Date(Date.UTC(anio, mes - 1, dia));
    var dow = (d.getUTCDay() + 6) % 7;            // 0=lunes .. 6=domingo
    d.setUTCDate(d.getUTCDate() - dow + 3);       // jueves de esa semana
    var anioISO = d.getUTCFullYear();
    var ene4 = new Date(Date.UTC(anioISO, 0, 4));
    var semana = 1 + Math.round(((d - ene4) / 86400000 - 3 + ((ene4.getUTCDay() + 6) % 7)) / 7);
    return { anioISO: anioISO, semana: semana };
  }
  function lunesDe(anio, mes, dia) {
    var d = new Date(Date.UTC(anio, mes - 1, dia));
    d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    return d;
  }

  // Semanas ISO que intersectan un mes: desde el lunes de la semana que
  // contiene el dia 1 hasta que el lunes de la semana siguiente ya cae
  // despues del ultimo dia del mes. El corte temporal de una semana
  // elegida es SIEMPRE la semana completa (lunes a domingo), aunque pise
  // el mes anterior o siguiente (ver filtroTemporal en crearPanelConsulta).
  function opcionesSemanaParaMes(anio, mes) {
    var opciones = [];
    var finMesTS = Date.UTC(anio, mes - 1, diasEnMes(anio, mes - 1));
    var lunes = lunesDe(anio, mes, 1);
    while (lunes.getTime() <= finMesTS) {
      var hastaDate = new Date(lunes.getTime() + 6 * 86400000);
      var desde = { anio: lunes.getUTCFullYear(), mes: lunes.getUTCMonth() + 1, dia: lunes.getUTCDate() };
      var hasta = { anio: hastaDate.getUTCFullYear(), mes: hastaDate.getUTCMonth() + 1, dia: hastaDate.getUTCDate() };
      var iso = isoSemana(desde.anio, desde.mes, desde.dia);
      opciones.push({ anioISO: iso.anioISO, semana: iso.semana, desde: desde, hasta: hasta });
      lunes = new Date(lunes.getTime() + 7 * 86400000);
    }
    return opciones;
  }

  // "S33 · 10–16 ago" o, si la semana pisa dos meses, "S31 · 27 jul – 2 ago".
  function etiquetaSemana(o) {
    var rango = (o.desde.mes === o.hasta.mes)
      ? o.desde.dia + '–' + o.hasta.dia + ' ' + MESES_ABREV[o.hasta.mes - 1]
      : o.desde.dia + ' ' + MESES_ABREV[o.desde.mes - 1] + ' – ' + o.hasta.dia + ' ' + MESES_ABREV[o.hasta.mes - 1];
    return 'S' + o.semana + ' · ' + rango;
  }

  // JS da 0=domingo..6=sabado. Aca se usa semana que arranca en lunes, asi
  // que se rota: 0=lunes..6=domingo.
  function primerDiaSemanaLunes(anio, mesIdx0) {
    return (new Date(anio, mesIdx0, 1).getDay() + 6) % 7;
  }
  function diasEnMes(anio, mesIdx0) {
    return new Date(anio, mesIdx0 + 1, 0).getDate();
  }

  // Precedencia del estado de un dia: si tiene algo pendiente es lo que
  // mas urge verlo (amber); si no, y tiene algo aprobado, esta resuelto
  // (olive); si el dia solo tiene rechazadas, horasAprobadas y
  // horasPendientes dan 0 pero el Jefe igual quiere poder entrar a ver
  // que paso (crimson).
  function estadoDia(diaInfo) {
    if (!diaInfo) return 'is-vacio';
    if (diaInfo.horasPendientes > 0) return 'is-pendiente';
    if (diaInfo.horasAprobadas > 0) return 'is-ok';
    return 'is-rechazada';
  }

  function calSkeletonHTML() {
    return '<div class="cal-skeleton">' +
      '<div class="sk-line" style="width:55%;height:11px"></div>' +
      '<div class="sk-line" style="width:100%;height:180px"></div>' +
      '</div>';
  }
  function calErrorHTML(msg) {
    return '<div class="estado-vacio">' + svgIcon('alertTriangle', 'icon-32') +
      '<strong>No pudimos cargar el calendario</strong><span>' + esc(msg) + '</span></div>';
  }
  function calVacioHTML() {
    return '<div class="estado-vacio">' + svgIcon('calendar', 'icon-32') +
      '<strong>No hubo horas extra en este mes</strong><span>Elegi otro mes con las flechas de arriba.</span></div>';
  }

  // Una tarjeta de calendario por vista (Supervisor/Jefe/Personas). La
  // funcion ya devuelve datos con alcance por rol resuelto en el
  // servidor, asi que las tres instancias solo difieren en el prefijo de
  // sus IDs en el DOM.
  function crearCalendario(prefijo) {
    var elTitulo = document.getElementById(prefijo + 'Titulo');
    var elBody = document.getElementById(prefijo + 'Body');
    var elPrev = document.getElementById(prefijo + 'Prev');
    var elNext = document.getElementById(prefijo + 'Next');

    var hoy = new Date();
    var estado = { anio: hoy.getFullYear(), mes: hoy.getMonth() + 1 };
    var cargando = false;

    function render(data) {
      elTitulo.textContent = MESES[data.mes - 1] + ' ' + data.anio;

      var porDia = {};
      (data.dias || []).forEach(function (d) { porDia[d.dia] = d; });

      var offset = primerDiaSemanaLunes(data.anio, data.mes - 1);
      var totalDias = diasEnMes(data.anio, data.mes - 1);
      var esMesActual = data.anio === hoy.getFullYear() && data.mes === hoy.getMonth() + 1;

      var celdas = '';
      for (var i = 0; i < offset; i++) celdas += '<div class="cal-day-blank" aria-hidden="true"></div>';
      for (var dia = 1; dia <= totalDias; dia++) {
        var info = porDia[dia];
        var esHoy = esMesActual && dia === hoy.getDate();
        var clases = 'cal-day ' + estadoDia(info) + (esHoy ? ' is-hoy' : '');
        if (info) {
          var nSolic = info.detalle.length;
          var partesEtiqueta = [];
          if (info.horasAprobadas > 0) {
            partesEtiqueta.push(fmtCorto(info.horasAprobadas) + (info.horasAprobadas === 1 ? ' hora aprobada' : ' horas aprobadas'));
          }
          if (info.horasPendientes > 0) {
            partesEtiqueta.push(fmtCorto(info.horasPendientes) + ' pendientes');
          }
          if (!partesEtiqueta.length) partesEtiqueta.push('sin horas aprobadas ni pendientes, con rechazadas');
          var aria = dia + ' de ' + MESES[data.mes - 1].toLowerCase() + ', ' + partesEtiqueta.join(', ') + ', ' +
            nSolic + (nSolic === 1 ? ' solicitud' : ' solicitudes');
          var horasHTML = '';
          if (info.horasAprobadas > 0 || info.horasPendientes > 0) {
            horasHTML = '<span class="cal-day-linea-horas">' +
              (info.horasAprobadas > 0 ? '<span class="cal-day-horas num">' + fmtCorto(info.horasAprobadas) + '</span>' : '') +
              (info.horasPendientes > 0 ? '<span class="cal-day-pend">+' + fmtCorto(info.horasPendientes) + 'p</span>' : '') +
              '</span>';
          }
          celdas += '<button type="button" class="' + clases + '" data-dia="' + dia + '" aria-label="' + esc(aria) + '">' +
            '<span class="cal-day-num">' + dia + '</span>' +
            horasHTML +
            '<span class="cal-day-dot" aria-hidden="true"></span>' +
            '</button>';
        } else {
          celdas += '<div class="' + clases + '"><span class="cal-day-num">' + dia + '</span></div>';
        }
      }
      var totalCeldas = offset + totalDias;
      var sobran = (7 - (totalCeldas % 7)) % 7;
      for (var j = 0; j < sobran; j++) celdas += '<div class="cal-day-blank" aria-hidden="true"></div>';

      var weekdayHTML = DIAS_SEMANA_CORTO.map(function (d) { return '<div class="cal-weekday">' + d + '</div>'; }).join('');

      var resumenHTML = '';
      if (data.totalAprobadas > 0 || data.totalPendientes > 0) {
        var maxHoras = Math.max.apply(null, (data.porSupervisor || []).map(function (p) { return p.horasAprobadas; }).concat([1]));
        var filasSup = (data.porSupervisor || []).map(function (p, i) {
          var pct = maxHoras > 0 ? Math.max(4, Math.round((p.horasAprobadas / maxHoras) * 100)) : 4;
          return '<li class="equipo-item" style="--i:' + i + '">' +
            '<div class="equipo-info">' + svgIcon('user', 'icon-16') + '<strong>' + esc(p.nombre) + '</strong></div>' +
            '<div class="equipo-bar-track"><div class="equipo-bar" style="--pct:' + pct + '%"></div></div>' +
            '<span class="equipo-saldo num">' + fmt(p.horasAprobadas) + ' hs' +
              (p.horasPendientes > 0 ? '<span class="cal-sup-pend">+' + fmtCorto(p.horasPendientes) + 'p</span>' : '') +
              '</span>' +
            '</li>';
        }).join('');
        var pendLineaHTML = data.totalPendientes > 0
          ? '<div class="cal-resumen-pend"><span class="chip chip-pendiente">' + svgIcon('clock', 'icon-14') +
            '+' + fmt(data.totalPendientes) + ' hs pendientes</span></div>'
          : '';
        resumenHTML =
          '<div class="cal-resumen">' +
            '<div class="cal-resumen-total"><span class="eyebrow">Total del mes</span><b class="num">' + fmt(data.totalAprobadas) + ' hs</b></div>' +
            pendLineaHTML +
            '<ul class="equipo-list">' + filasSup + '</ul>' +
          '</div>';
      }

      var vacioMes = !data.dias || !data.dias.length;
      elBody.innerHTML = '<div class="cal-grid">' + weekdayHTML + celdas + '</div>' +
        (vacioMes ? calVacioHTML() : resumenHTML);

      elBody.querySelectorAll('.cal-day[data-dia]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var d = porDia[Number(btn.dataset.dia)];
          if (d) abrirDetalleDia(data, d);
        });
      });
    }

    async function cargar(anio, mes) {
      if (cargando) return;
      cargando = true;
      elBody.innerHTML = calSkeletonHTML();
      elPrev.disabled = true;
      elNext.disabled = true;
      try {
        var data = await llamarServidor('apiCalendario', anio, mes);
        estado.anio = data.anio;
        estado.mes = data.mes;
        render(data);
      } catch (err) {
        elTitulo.textContent = MESES[mes - 1] + ' ' + anio;
        elBody.innerHTML = calErrorHTML(err.message || 'No se pudo conectar con el servidor.');
      } finally {
        cargando = false;
        elPrev.disabled = false;
        elNext.disabled = false;
      }
    }

    elPrev.addEventListener('click', function () {
      var m = estado.mes - 1, a = estado.anio;
      if (m < 1) { m = 12; a -= 1; }
      cargar(a, m);
    });
    elNext.addEventListener('click', function () {
      var m = estado.mes + 1, a = estado.anio;
      if (m > 12) { m = 1; a += 1; }
      cargar(a, m);
    });

    return {
      // Vuelve a pedir del servidor el mes que se este mirando ahora
      // mismo (no siempre el actual: si el usuario navego a otro mes y
      // despues aprueba/carga algo, no le queremos resetear la vista).
      recargarActual: function () { cargar(estado.anio, estado.mes); }
    };
  }

  var overlayCalDia = document.getElementById('overlayCalDia');
  var tituloModalCalDia = document.getElementById('tituloModalCalDia');
  var calDiaTablaBody = document.getElementById('calDiaTablaBody');
  var calDiaTotal = document.getElementById('calDiaTotal');
  var calDiaPendRow = document.getElementById('calDiaPendRow');
  var calDiaPend = document.getElementById('calDiaPend');

  function abrirDetalleDia(data, diaInfo) {
    var fechaObj = new Date(data.anio, data.mes - 1, diaInfo.dia);
    var nombreDiaSemana = DIAS_SEMANA_LARGO[(fechaObj.getDay() + 6) % 7];
    tituloModalCalDia.textContent = nombreDiaSemana + ' ' + diaInfo.dia + ' de ' +
      MESES[data.mes - 1].toLowerCase() + ' de ' + data.anio;

    calDiaTablaBody.innerHTML = diaInfo.detalle.map(function (r) {
      var info = chipInfo(r.estado);
      return '<tr>' +
        '<td><span class="persona-cell">' + svgIcon('user', 'icon-14') + esc(r.supervisor) + '</span></td>' +
        '<td class="num-col num">' + fmt(r.horas) + ' hs</td>' +
        '<td>' + esc(r.linea) + '</td>' +
        '<td class="motivo-cell">' + esc(r.motivo) + '</td>' +
        '<td><span class="chip ' + info.clase + '">' + svgIcon(info.icono, 'icon-14') + info.texto + '</span></td>' +
        '</tr>';
    }).join('');

    if (diaInfo.horasPendientes > 0) {
      calDiaPend.textContent = fmt(diaInfo.horasPendientes) + ' hs';
      calDiaPendRow.hidden = false;
    } else {
      calDiaPendRow.hidden = true;
    }
    calDiaTotal.textContent = fmt(diaInfo.horasAprobadas) + ' hs';
    abrirModal(overlayCalDia);
  }

  var calSupervisor = crearCalendario('calSupervisor');
  var calJefe = crearCalendario('calJefe');
  var calPersonas = crearCalendario('calPersonas');

  /* ==================== PANEL CONSULTA (Jefe / Personas) ==================== */
  // Un panel de consulta por vista (Jefe/Personas). apiConsulta() ya
  // devuelve solo las filas que el rol de quien pregunta puede ver
  // (resuelto en el SERVIDOR, igual que apiCalendario); los 5 filtros de
  // aca son PRESENTACION en el cliente sobre ese mismo conjunto de datos,
  // nunca una fuente adicional de alcance. No va en viewSupervisor: un
  // Supervisor ya ve sus propias solicitudes en "Mis solicitudes".
  function crearPanelConsulta(prefijo) {
    var elSupervisor = document.getElementById(prefijo + 'Supervisor');
    var elMes = document.getElementById(prefijo + 'Mes');
    var elSemana = document.getElementById(prefijo + 'Semana');
    var elEstado = document.getElementById(prefijo + 'Estado');
    var elLinea = document.getElementById(prefijo + 'Linea');
    var elLimpiar = document.getElementById(prefijo + 'Limpiar');
    var elResumen = document.getElementById(prefijo + 'Resumen');
    var elDesglose = document.getElementById(prefijo + 'Desglose');
    var elLista = document.getElementById(prefijo + 'Lista');

    var hoy = new Date();
    var claveHoy = hoy.getFullYear() + '-' + (hoy.getMonth() + 1);
    var datos = [];
    var cargando = false;
    // Defaults (2.1h del plan): Mes = mes actual, Semana = todas,
    // Estado = Todos, Supervisor = Todos, Linea = Todas.
    var filtros = {
      supervisor: 'Todos', mesValor: claveHoy, semanaValor: '',
      estado: 'Todos', linea: 'Todas'
    };

    // Clave numerica para ordenar por fecha desc; las filas sin fecha
    // legible (fecha:null) quedan al final.
    function claveFecha(f) {
      return f.fecha ? (f.fecha.anio * 10000 + f.fecha.mes * 100 + f.fecha.dia) : -1;
    }

    // El corte temporal es SIEMPRE semana O mes, nunca los dos a la vez
    // (aplicar ambos recortaria la semana ISO y daria un total falso si la
    // semana pisa el mes anterior o siguiente).
    function pasaFila(f) {
      if (filtros.supervisor !== 'Todos' && f.supervisor !== filtros.supervisor) return false;
      if (filtros.estado !== 'Todos' && f.estado !== filtros.estado) return false;
      if (filtros.linea !== 'Todas' && f.linea !== filtros.linea) return false;
      if (filtros.semanaValor) {
        if (!f.fecha) return false;
        var iso = isoSemana(f.fecha.anio, f.fecha.mes, f.fecha.dia);
        var sp = filtros.semanaValor.split('-');
        if (iso.anioISO !== Number(sp[0]) || iso.semana !== Number(sp[1])) return false;
      } else if (filtros.mesValor !== 'Todos') {
        if (!f.fecha) return false;
        var mp = filtros.mesValor.split('-');
        if (f.fecha.anio !== Number(mp[0]) || f.fecha.mes !== Number(mp[1])) return false;
      }
      return true;
    }

    function actualizarDisabledSemana() {
      var deshabilitada = filtros.mesValor === 'Todos';
      elSemana.disabled = deshabilitada;
      elSemana.title = deshabilitada ? 'Elegi un mes primero' : '';
      if (deshabilitada) elSemana.setAttribute('aria-disabled', 'true');
      else elSemana.removeAttribute('aria-disabled');
    }

    // Opciones = "Todos" + nombres distintos presentes EN LOS DATOS
    // (alfabetico): sale de los datos y no del directorio, asi se puede
    // consultar el historial de alguien ya dado de baja.
    function poblarSupervisor() {
      var seleccionPrevia = filtros.supervisor;
      var vistos = {};
      var nombres = [];
      datos.forEach(function (f) {
        if (!f.supervisor || vistos[f.supervisor]) return;
        vistos[f.supervisor] = true;
        nombres.push(f.supervisor);
      });
      nombres.sort(function (a, b) { return a.localeCompare(b, 'es'); });
      elSupervisor.innerHTML = '<option value="Todos">Todos</option>' + nombres.map(function (n) {
        return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
      }).join('');
      filtros.supervisor = (seleccionPrevia === 'Todos' || nombres.indexOf(seleccionPrevia) !== -1) ? seleccionPrevia : 'Todos';
      elSupervisor.value = filtros.supervisor;
    }

    // Opciones = "Todos" + meses distintos presentes + el mes actual
    // (aunque este vacio), orden desc, etiqueta "Agosto 2026".
    function poblarMes() {
      var seleccionPrevia = filtros.mesValor;
      var vistos = {};
      var lista = [];
      datos.forEach(function (f) {
        if (!f.fecha) return;
        var k = f.fecha.anio + '-' + f.fecha.mes;
        if (vistos[k]) return;
        vistos[k] = true;
        lista.push({ anio: f.fecha.anio, mes: f.fecha.mes });
      });
      if (!vistos[claveHoy]) lista.push({ anio: hoy.getFullYear(), mes: hoy.getMonth() + 1 });
      lista.sort(function (a, b) { return (b.anio * 100 + b.mes) - (a.anio * 100 + a.mes); });

      elMes.innerHTML = '<option value="Todos">Todos</option>' + lista.map(function (m) {
        return '<option value="' + m.anio + '-' + m.mes + '">' + esc(MESES[m.mes - 1] + ' ' + m.anio) + '</option>';
      }).join('');

      var claves = lista.map(function (m) { return m.anio + '-' + m.mes; });
      filtros.mesValor = (seleccionPrevia === 'Todos' || claves.indexOf(seleccionPrevia) !== -1) ? seleccionPrevia : claveHoy;
      elMes.value = filtros.mesValor;
    }

    // Selector de semana DEPENDIENTE del mes elegido: lista las semanas ISO
    // que intersectan el mes (o queda deshabilitado si Mes = "Todos").
    function poblarSemana() {
      var seleccionPrevia = filtros.semanaValor;
      elSemana.innerHTML = '<option value="">Todas</option>';
      actualizarDisabledSemana();
      if (filtros.mesValor === 'Todos') {
        filtros.semanaValor = '';
        elSemana.value = '';
        return;
      }
      var mp = filtros.mesValor.split('-');
      var opciones = opcionesSemanaParaMes(Number(mp[0]), Number(mp[1]));
      opciones.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.anioISO + '-' + o.semana;
        opt.textContent = etiquetaSemana(o);
        elSemana.appendChild(opt);
      });
      var sigueValida = opciones.some(function (o) { return (o.anioISO + '-' + o.semana) === seleccionPrevia; });
      filtros.semanaValor = sigueValida ? seleccionPrevia : '';
      elSemana.value = filtros.semanaValor;
    }

    // Resumen: SIEMPRE tres cifras separadas (nunca una mezclada). Con
    // Estado=Rechazada el principal da "0,0 hs" y la chip de rechazadas es
    // la protagonista: es el comportamiento correcto, no un caso especial.
    function renderResumen(lista) {
      var aprobadas = 0, pendientes = 0, rechazadas = 0, rechCount = 0;
      lista.forEach(function (f) {
        if (f.estado === 'Aprobada') aprobadas += f.horas;
        else if (f.estado === 'Pendiente') pendientes += f.horas;
        else if (f.estado === 'Rechazada') { rechazadas += f.horas; rechCount++; }
      });
      var chips = '';
      if (pendientes > 0) {
        chips += '<span class="chip chip-pendiente">' + svgIcon('clock', 'icon-14') +
          '+' + fmt(pendientes) + ' hs pendientes</span>';
      }
      if (rechCount > 0) {
        chips += '<span class="chip chip-rechazada">' + svgIcon('x', 'icon-14') +
          rechCount + (rechCount === 1 ? ' rechazada' : ' rechazadas') + ' · ' + fmt(rechazadas) + ' hs (no suman)</span>';
      }
      elResumen.innerHTML =
        '<div class="kpi-label">Horas aprobadas</div>' +
        '<div class="kpi-value">' + fmt(aprobadas) + ' hs</div>' +
        (chips ? '<div class="con-resumen-chips">' + chips + '</div>' : '');
    }

    // Desglose por supervisor: mismo patron .equipo-item que el resumen del
    // Calendario (barra --grad-gold sobre horas Aprobadas, sufijo "+Xp" si
    // ademas tiene Pendientes en el conjunto filtrado).
    function renderDesglose(lista) {
      var mapa = {};
      var orden = [];
      lista.forEach(function (f) {
        if (f.estado !== 'Aprobada' && f.estado !== 'Pendiente') return;
        if (!mapa[f.supervisor]) { mapa[f.supervisor] = { horasAprobadas: 0, horasPendientes: 0 }; orden.push(f.supervisor); }
        if (f.estado === 'Aprobada') mapa[f.supervisor].horasAprobadas += f.horas;
        else mapa[f.supervisor].horasPendientes += f.horas;
      });
      if (!orden.length) { elDesglose.innerHTML = ''; return; }
      var arr = orden.map(function (nombre) {
        return { nombre: nombre, horasAprobadas: mapa[nombre].horasAprobadas, horasPendientes: mapa[nombre].horasPendientes };
      }).sort(function (a, b) { return b.horasAprobadas - a.horasAprobadas; });
      var maxHoras = Math.max.apply(null, arr.map(function (p) { return p.horasAprobadas; }).concat([1]));
      elDesglose.innerHTML = arr.map(function (p, i) {
        var pct = maxHoras > 0 ? Math.max(4, Math.round((p.horasAprobadas / maxHoras) * 100)) : 4;
        return '<li class="equipo-item" style="--i:' + i + '">' +
          '<div class="equipo-info">' + svgIcon('user', 'icon-16') + '<strong>' + esc(p.nombre) + '</strong></div>' +
          '<div class="equipo-bar-track"><div class="equipo-bar" style="--pct:' + pct + '%"></div></div>' +
          '<span class="equipo-saldo num">' + fmt(p.horasAprobadas) + ' hs' +
            (p.horasPendientes > 0 ? '<span class="cal-sup-pend">+' + fmtCorto(p.horasPendientes) + 'p</span>' : '') +
          '</span>' +
          '</li>';
      }).join('');
    }

    // Lista detallada: patron .solicitud-item, orden fecha desc (id desc de
    // desempate). El Motivo SIEMPRE pasa por esc(), sin excepcion.
    function renderLista(lista) {
      if (!lista.length) {
        elLista.innerHTML = estadoVacio('Ninguna solicitud cumple estos filtros', 'Probá con otros filtros.');
        return;
      }
      var ordenada = lista.slice().sort(function (a, b) {
        var ka = claveFecha(a), kb = claveFecha(b);
        if (ka !== kb) return kb - ka;
        return a.id < b.id ? 1 : -1;
      });
      elLista.innerHTML = ordenada.map(function (f, i) {
        var info = chipInfo(f.estado);
        var meta = [f.fechaTexto || '—'];
        if (f.fecha) meta.push('S' + isoSemana(f.fecha.anio, f.fecha.mes, f.fecha.dia).semana);
        meta.push(f.supervisor);
        return '<li class="solicitud-item" style="--i:' + i + '">' +
          '<div class="sol-main">' +
            '<span class="sol-tipo">' + esc(f.linea || '-') + '</span>' +
            '<div class="sol-info"><strong>' + esc(fmt(f.horas) + ' hs · ' + (f.motivo || '')) + '</strong>' +
            '<span class="sol-meta">' + esc(meta.join(' · ')) + '</span></div>' +
          '</div>' +
          '<span class="chip ' + info.clase + '">' + svgIcon(info.icono, 'icon-14') + info.texto + '</span>' +
          '</li>';
      }).join('');
    }

    function aplicarFiltros() {
      var filtrados = datos.filter(pasaFila);
      renderResumen(filtrados);
      renderDesglose(filtrados);
      renderLista(filtrados);
    }

    function deshabilitarControles(v) {
      elSupervisor.disabled = v;
      elMes.disabled = v;
      elEstado.disabled = v;
      elLinea.disabled = v;
      elLimpiar.disabled = v;
    }

    elSupervisor.addEventListener('change', function () { filtros.supervisor = elSupervisor.value; aplicarFiltros(); });
    elMes.addEventListener('change', function () {
      filtros.mesValor = elMes.value;
      poblarSemana();
      aplicarFiltros();
    });
    elSemana.addEventListener('change', function () { filtros.semanaValor = elSemana.value; aplicarFiltros(); });
    elEstado.addEventListener('change', function () { filtros.estado = elEstado.value; aplicarFiltros(); });
    elLinea.addEventListener('change', function () { filtros.linea = elLinea.value; aplicarFiltros(); });
    elLimpiar.addEventListener('click', function () {
      filtros.supervisor = 'Todos';
      filtros.mesValor = claveHoy;
      filtros.semanaValor = '';
      filtros.estado = 'Todos';
      filtros.linea = 'Todas';
      elSupervisor.value = 'Todos';
      elEstado.value = 'Todos';
      elLinea.value = 'Todas';
      elMes.value = filtros.mesValor;
      poblarSemana();
      aplicarFiltros();
    });

    async function cargar() {
      if (cargando) return;
      cargando = true;
      deshabilitarControles(true);
      elSemana.disabled = true;
      elResumen.innerHTML = calSkeletonHTML();
      elDesglose.innerHTML = '';
      elLista.innerHTML = '';
      try {
        var data = await llamarServidor('apiConsulta');
        datos = data.solicitudes || [];
        poblarSupervisor();
        poblarMes();
        poblarSemana(); // define el disabled final de elSemana segun filtros.mesValor
        aplicarFiltros();
      } catch (err) {
        elResumen.innerHTML = calErrorHTML(err.message || 'No se pudo conectar con el servidor.');
        elDesglose.innerHTML = '';
        elLista.innerHTML = '';
      } finally {
        cargando = false;
        deshabilitarControles(false);
      }
    }

    return { recargar: cargar };
  }

  // Instanciar solo los paneles cuyo DOM existe (viewSupervisor no tiene Consulta).
  var conJefe = document.getElementById('conJefeCard') ? crearPanelConsulta('conJefe') : null;
  var conPersonas = document.getElementById('conPersonasCard') ? crearPanelConsulta('conPersonas') : null;

  /* ==================== FORM: CARGAR HORAS EXTRA ==================== */
  var formHE = document.getElementById('formHE');
  var btnEnviarHE = document.getElementById('btnEnviarHE');
  var errorHE = document.getElementById('errorHE');
  var errorHETexto = document.getElementById('errorHETexto');

  formHE.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!formHE.reportValidity()) return;
    errorHE.hidden = true;
    btnEnviarHE.disabled = true;
    try {
      await llamarServidor('apiCrearHoraExtra', {
        fecha: formHE.fecha.value,
        horas: formHE.horas.value,
        linea: formHE.linea.value,
        motivo: formHE.motivo.value
      });
      cerrarModal(overlayHE);
      mostrarExito('Horas extra enviadas');
      cargarEstado(); // no asumimos que salio bien en la UI: releemos del servidor
    } catch (err) {
      errorHETexto.textContent = err.message || 'No se pudo enviar la solicitud.';
      errorHE.hidden = false;
    } finally {
      btnEnviarHE.disabled = false;
    }
  });

  /* ==================== FORM: PEDIR COMPENSACION ==================== */
  var compHorasDescontar = document.getElementById('compHorasDescontar');
  var compSaldoActual = document.getElementById('compSaldoActual');
  var compSaldoResultante = document.getElementById('compSaldoResultante');
  var compCalcBox = document.getElementById('compCalcBox');
  var compError = document.getElementById('compError');
  var compErrorTexto = document.getElementById('compErrorTexto');
  var btnEnviarComp = document.getElementById('btnEnviarComp');
  var formComp = document.getElementById('formComp');

  var compHorasSueltasFila = document.getElementById('compHorasSueltasFila');
  var compHorasSueltas = document.getElementById('compHorasSueltas');

  // Horas del pedido segun el tipo elegido. Devuelve null si el usuario
  // eligio "otra cantidad" y todavia no puso un entero valido: en ese caso
  // no hay nada que calcular y el envio queda bloqueado.
  function horasPedidas() {
    var tipo = formComp.tipo.value;
    if (tipo === 'completo') return 8;
    if (tipo === 'medio') return 4;
    var v = compHorasSueltas.value.trim();
    if (v === '') return null;
    var n = Number(v);
    if (!isFinite(n) || n < 1 || Math.floor(n) !== n) return null;
    return n;
  }

  function calcularComp() {
    var esSuelta = formComp.tipo.value === 'personalizado';
    compHorasSueltasFila.hidden = !esSuelta;

    var horas = horasPedidas();
    var saldoActual = (estadoActual && estadoActual.saldo) ? estadoActual.saldo.disponible : 0;

    // Con "otra cantidad" vacia o no entera, mostramos el pedido en blanco
    // y avisamos que falta el dato, en vez de calcular sobre un cero que
    // haria parecer que el pedido es valido.
    if (horas === null) {
      compHorasDescontar.textContent = '—';
      compSaldoActual.textContent = fmt(saldoActual) + ' hs';
      compSaldoResultante.textContent = '—';
      compCalcBox.classList.remove('invalid');
      var vacio = compHorasSueltas.value.trim() === '';
      compErrorTexto.textContent = vacio
        ? 'Indica cuantas horas queres compensar.'
        : 'La cantidad tiene que ser un numero entero de horas, de 1 en adelante.';
      compError.hidden = vacio;
      btnEnviarComp.disabled = true;
      btnEnviarComp.setAttribute('aria-disabled', 'true');
      return;
    }

    var resultante = saldoActual - horas;
    var insuficiente = resultante < 0;

    compHorasDescontar.textContent = fmt(horas) + ' hs';
    compSaldoActual.textContent = fmt(saldoActual) + ' hs';
    compSaldoResultante.textContent = fmt(resultante) + ' hs';
    compCalcBox.classList.toggle('invalid', insuficiente);
    compErrorTexto.textContent = 'Saldo insuficiente: no se puede solicitar mas horas que las disponibles.';
    compError.hidden = !insuficiente;
    btnEnviarComp.disabled = insuficiente;
    btnEnviarComp.setAttribute('aria-disabled', insuficiente ? 'true' : 'false');
  }

  Array.prototype.forEach.call(formComp.querySelectorAll('input[name="tipo"]'), function (r) {
    r.addEventListener('change', function () {
      calcularComp();
      if (formComp.tipo.value === 'personalizado') compHorasSueltas.focus();
    });
  });
  compHorasSueltas.addEventListener('input', calcularComp);

  formComp.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!formComp.reportValidity()) return;
    compError.hidden = true;
    btnEnviarComp.disabled = true;
    try {
      await llamarServidor('apiCrearCompensacion', {
        fecha: formComp.fecha.value,
        tipo: formComp.tipo.value,
        // Solo se usa con "otra cantidad": en dia completo y medio dia el
        // servidor calcula las horas por su cuenta y descarta este valor.
        horas: horasPedidas()
      });
      cerrarModal(overlayComp);
      mostrarExito('Compensacion solicitada');
      cargarEstado();
    } catch (err) {
      // El bloqueo por saldo insuficiente llega como error del servidor:
      // es el UNICO lugar donde se bloquea (ver ControlHorasExtra.gs).
      compErrorTexto.textContent = err.message || 'No se pudo enviar la solicitud.';
      compCalcBox.classList.add('invalid');
      compError.hidden = false;
    } finally {
      btnEnviarComp.disabled = false;
    }
  });

  /* ==================== INIT ==================== */
  cargarEstado();

})();
</script>
